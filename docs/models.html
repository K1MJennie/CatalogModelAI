<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f1f4f1">
  <meta name="description" content="Katalog model Gemma, disusun menurut generasi.">
  <title>Model Gemma | Moezza</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: light;
      --page: #f1f4f1;
      --surface: #fbfcfa;
      --ink: #202923;
      --muted: #626c64;
      --line: #cbd3cc;
      --accent: #17614c;
      --focus: #17614c;
      --radius: 4px;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --page: #171d19;
      --surface: #202923;
      --ink: #eef1ec;
      --muted: #b3beb5;
      --line: #3c4940;
      --accent: #9dd2b1;
      --focus: #9dd2b1;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    a { color: var(--accent); }
    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }
    .shell { width: min(100% - 48px, 1040px); margin: 0 auto; }
    .topbar { border-bottom: 1px solid var(--line); }
    .topbar-inner {
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .brand { color: var(--ink); font-size: 14px; font-weight: 650; text-decoration: none; }
    .brand span { color: var(--muted); font-weight: 400; }
    .theme-toggle {
      min-width: 88px;
      min-height: 40px;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: transparent;
      color: var(--ink);
      font: inherit;
      cursor: pointer;
    }
    main { padding: 50px 0 72px; }
    .page-heading {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 20px;
      padding-bottom: 26px;
    }
    .eyebrow { margin: 0 0 8px; color: var(--muted); font-size: 13px; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 8px; font-size: clamp(2rem, 4vw, 2.75rem); line-height: 1.12; letter-spacing: -0.045em; }
    .intro { max-width: 52ch; margin: 0; color: var(--muted); }
    .catalog-version { margin: 0 0 3px; color: var(--muted); font-size: 13px; text-align: right; }
    .controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 220px;
      gap: 16px;
      align-items: end;
      padding: 18px 0 14px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }
    .field label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 13px; }
    .field input, .field select {
      width: 100%;
      min-height: 42px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
      font: inherit;
    }
    .catalog-status { min-height: 22px; margin: 12px 0 0; color: var(--muted); font-size: 13px; }
    .generation {
      display: grid;
      grid-template-columns: 168px minmax(0, 1fr);
      gap: 24px;
      padding: 30px 0 0;
    }
    .generation-heading { padding-top: 13px; }
    .generation-heading h2 { margin-bottom: 4px; font-size: 18px; font-weight: 650; }
    .generation-heading p { margin: 0; color: var(--muted); font-size: 13px; }
    .model-table { min-width: 0; }
    .table-head, .model-row {
      display: grid;
      grid-template-columns: minmax(130px, 1.05fr) minmax(180px, 1.7fr) minmax(115px, 0.8fr) 112px;
      gap: 14px;
      align-items: center;
    }
    .table-head {
      min-height: 38px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }
    .model-row { min-height: 76px; border-bottom: 1px solid var(--line); }
    .model-name { min-width: 0; }
    .model-name h3 { margin: 0; font-size: 15px; font-weight: 620; }
    .model-summary, .model-parameters { margin: 0; color: var(--muted); font-size: 13px; }
    .model-link { width: fit-content; font-size: 13px; text-underline-offset: 3px; }
    .empty { margin: 0; padding: 16px 0; border-top: 1px solid var(--line); color: var(--muted); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .notice { margin: 40px 0 0 192px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    footer { padding: 18px 0 26px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    footer a { text-underline-offset: 3px; }

    @media (max-width: 760px) {
      .generation { grid-template-columns: 130px minmax(0, 1fr); gap: 16px; }
      .table-head, .model-row { grid-template-columns: minmax(120px, 1fr) minmax(150px, 1.4fr) 100px; }
      .table-head span:last-child { display: none; }
      .model-link { grid-column: 2; grid-row: 2; }
      .model-row { padding: 10px 0; }
      .notice { margin-left: 146px; }
    }
    @media (max-width: 560px) {
      .shell { width: min(100% - 32px, 1040px); }
      main { padding-top: 36px; }
      .page-heading { grid-template-columns: 1fr; gap: 10px; }
      .catalog-version { text-align: left; }
      .controls { grid-template-columns: 1fr; gap: 12px; }
      .generation { grid-template-columns: 1fr; gap: 10px; padding-top: 26px; }
      .generation-heading { padding-top: 0; }
      .table-head { display: none; }
      .model-row { grid-template-columns: minmax(0, 1fr) auto; gap: 3px 12px; padding: 12px 0; }
      .model-name { grid-column: 1; }
      .model-parameters { grid-column: 2; grid-row: 1; text-align: right; }
      .model-summary { grid-column: 1 / -1; }
      .model-link { grid-column: 1; grid-row: auto; margin-top: 3px; }
      .notice { margin: 34px 0 0; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="shell topbar-inner">
      <a class="brand" href="./index.html#technology">Moezza <span>/ Model Gemma</span></a>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false">Gelap</button>
    </div>
  </header>

  <main class="shell" id="main">
    <section class="page-heading" aria-labelledby="page-title">
      <div>
        <p class="eyebrow">Katalog model</p>
        <h1 id="page-title">Gemma</h1>
        <p class="intro">Model terbuka dari Google, disusun menurut generasi dan ukuran.</p>
      </div>
      <p class="catalog-version" id="catalog-version">Versi katalog —</p>
    </section>

    <section aria-label="Daftar model Gemma">
      <div class="controls">
        <div class="field">
          <label for="search">Cari nama atau ukuran</label>
          <input id="search" type="search" placeholder="Misalnya, 12B" autocomplete="off">
        </div>
        <div class="field">
          <label for="generation-filter">Generasi</label>
          <select id="generation-filter"><option value="all">Semua generasi</option></select>
        </div>
      </div>
      <p class="catalog-status" id="catalog-status" role="status" aria-live="polite">Memuat data model…</p>
      <div id="catalog"></div>
    </section>

    <p class="notice">Berkas tanda tangan katalog masih placeholder dan belum diverifikasi.</p>
  </main>

  <footer>
    <div class="shell">Rincian teknis: <a href="https://ai.google.dev/gemma/docs" target="_blank" rel="noopener noreferrer">dokumentasi Gemma</a>.</div>
  </footer>

  <script>
    const catalogRoot = new URL("./catalog/v1/", window.location.href);
    const catalogNode = document.querySelector("#catalog");
    const statusNode = document.querySelector("#catalog-status");
    const versionNode = document.querySelector("#catalog-version");
    const searchNode = document.querySelector("#search");
    const filterNode = document.querySelector("#generation-filter");

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function render(generations) {
      const query = searchNode.value.trim().toLocaleLowerCase("id");
      const selected = filterNode.value;
      catalogNode.replaceChildren();
      let visibleModels = 0;

      for (const generation of generations) {
        if (selected !== "all" && generation.id !== selected) continue;
        const matches = generation.models.filter((model) =>
          `${model.name} ${model.parameters} ${model.description}`.toLocaleLowerCase("id").includes(query)
        );
        if (query && matches.length === 0) continue;

        const section = element("section", "generation");
        section.setAttribute("aria-labelledby", `heading-${generation.id}`);
        const heading = element("header", "generation-heading");
        const title = element("h2", "", generation.name);
        title.id = `heading-${generation.id}`;
        const count = generation.status === "future"
          ? generation.statusLabel
          : `${matches.length} model`;
        heading.append(title, element("p", "", count));
        section.append(heading);

        if (matches.length === 0) {
          section.append(element("p", "empty", generation.emptyMessage));
        } else {
          const table = element("div", "model-table");
          const columns = element("div", "table-head");
          columns.setAttribute("aria-hidden", "true");
          columns.append(
            element("span", "", "Model"),
            element("span", "", "Ringkasan"),
            element("span", "", "Parameter"),
            element("span", "", "")
          );
          table.append(columns);

          for (const model of matches) {
            const row = element("article", "model-row");
            const name = element("div", "model-name");
            name.append(element("h3", "", model.name));
            row.append(name);
            const summary = element("p", "model-summary");
            summary.append(element("span", "sr-only", "Ringkasan: "), document.createTextNode(model.description));
            row.append(summary);
            const parameters = element("p", "model-parameters");
            parameters.append(element("span", "sr-only", "Parameter: "), document.createTextNode(model.parameters));
            row.append(parameters);
            const link = element("a", "model-link", "Dokumentasi resmi");
            link.href = model.source;
            link.setAttribute("aria-label", `Dokumentasi resmi ${model.name}`);
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            row.append(link);
            table.append(row);
            visibleModels += 1;
          }
          section.append(table);
        }
        catalogNode.append(section);
      }

      if (!catalogNode.childElementCount) {
        catalogNode.append(element("p", "empty", "Tidak ada model yang cocok dengan pencarian ini."));
      }
      statusNode.textContent = `${visibleModels} model ditampilkan`;
    }

    async function loadCatalog() {
      try {
        const response = await fetch(new URL("index.json", catalogRoot));
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const index = await response.json();
        const generations = await Promise.all(index.generations.map(async (entry) => {
          const response = await fetch(new URL(entry.file, catalogRoot));
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          return { ...entry, ...data };
        }));

        for (const generation of generations) {
          const option = document.createElement("option");
          option.value = generation.id;
          option.textContent = generation.name;
          filterNode.append(option);
        }
        searchNode.addEventListener("input", () => render(generations));
        filterNode.addEventListener("change", () => render(generations));
        versionNode.textContent = `Versi katalog ${index.version}`;
        render(generations);
      } catch {
        statusNode.textContent = "Data model gagal dimuat.";
        catalogNode.replaceChildren(element("p", "empty", "Buka halaman ini melalui GitHub Pages atau server lokal agar berkas katalog dapat dibaca."));
      }
    }

    const themeButton = document.querySelector("#theme-toggle");
    const savedTheme = localStorage.getItem("catalog-theme");
    if (savedTheme === "dark") document.documentElement.dataset.theme = "dark";
    themeButton.setAttribute("aria-pressed", String(savedTheme === "dark"));
    themeButton.setAttribute("aria-label", savedTheme === "dark" ? "Aktifkan tema terang" : "Aktifkan tema gelap");
    themeButton.textContent = savedTheme === "dark" ? "Terang" : "Gelap";
    themeButton.addEventListener("click", () => {
      const dark = document.documentElement.dataset.theme !== "dark";
      if (dark) document.documentElement.dataset.theme = "dark";
      else delete document.documentElement.dataset.theme;
      localStorage.setItem("catalog-theme", dark ? "dark" : "light");
      themeButton.setAttribute("aria-pressed", String(dark));
      themeButton.setAttribute("aria-label", dark ? "Aktifkan tema terang" : "Aktifkan tema gelap");
      themeButton.textContent = dark ? "Terang" : "Gelap";
    });

    loadCatalog();
  </script>
</body>
</html>
